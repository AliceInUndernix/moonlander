# Dotterel dark theme: its own small plugin, so it has its own tick box in
# Configure > Plugins (on/off without touching Dotterel).
# The code is the old plugin's dark theme, unchanged.
[metadata]
name = plover-dotterel-dark-theme
version = 1.0.0.dev1
description = Dark theme for Plover's windows (works on Linux too)
keywords = plover plover_plugin

[options]
zip_safe = True
install_requires =
    plover>=4.0.0
packages = plover_dotterel_dark

# An "extension" is a plugin Plover can switch on and off in Configure > Plugins.
[options.entry_points]
plover.extension =
    dotterel_dark_theme = plover_dotterel_dark:DarkTheme
