# The install recipe: what this plugin is called, and which file is the system.
[metadata]
name = plover-dotterel
version = 1.5.0
description = Dotterel steno system for Plover
keywords = plover plover_plugin

[options]
packages = plover_dotterel
install_requires =
    plover>=4.0.0
    # reads the .py dictionary (dotterel-modifiers.py)
    plover-python-dictionary
    # reads the .modal dictionary (movement)
    plover-modal-dictionary
    # {:stitch:...} in punctuation: s-p-e-l-l-i-n-g with hyphens
    plover-stitching
    # =repeat_last_translation (# alone repeats the last word)
    plover-last-translation
    # reconnects the Moonlander by itself when its connection drops (an
    # extension: tick "plover_auto_reconnect_machine" in Configure > Plugins)
    plover-auto-reconnect-machine

# Tells Plover: there is a system called "Dotterel", and it is system.py.
# It then shows up in Configure > System.
[options.entry_points]
plover.system =
    Dotterel = plover_dotterel.system
# Commands a stroke can run: {PLOVER:DOTTEREL_RAW} (see raw_mode.py),
# {PLOVER:DOTTEREL_ADD} (the small add window, see quickadd.py).
plover.command =
    dotterel_raw = plover_dotterel.raw_mode:raw_toggle
    dotterel_add = plover_dotterel.quickadd:quick_add
# Text commands a stroke can run: {:retro_us} (see retro_us.py).
plover.meta =
    retro_us = plover_dotterel.retro_us:meta_retro_us
# The Builder window: in Plover's toolbar, and Ctrl+B in the main window.
plover.gui.qt.tool =
    dotterel_builder = plover_dotterel.builder:DotterelBuilder

# Ship the dictionaries folder with the plugin.
[options.package_data]
plover_dotterel = dictionaries/*.json, dictionaries/*.py, dictionaries/*.modal, data/*.json, data/*.txt, data/*.gz, data/*.dic
